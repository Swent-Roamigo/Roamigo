# AI assistance was used for implementation support.
name: Build APK on main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only the APK of the latest commit is useful, so an older build is cancelled.
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      apk-name: ${{ steps.apk.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The team debug keystore is the one registered in Firebase, so Google Sign-In works in
      # this APK. The default keystore generated on the runner would not be recognized.
      - name: Restore Firebase and signing configuration
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$GOOGLE_SERVICES" ] || [ -z "$ANDROID_DEBUG_KEYSTORE" ]; then
            echo "::error::Set GOOGLE_SERVICES to the Base64-encoded google-services.json and ANDROID_DEBUG_KEYSTORE to the Base64-encoded team debug keystore registered in Firebase."
            exit 1
          fi
          umask 077
          printf '%s' "$GOOGLE_SERVICES" | base64 --decode > app/google-services.json
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          GEONAMES_USERNAME: cdunoyer
        run: |
          if [ -z "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "::error::Set MAPBOX_ACCESS_TOKEN to the Mapbox public access token used by the app maps."
            exit 1
          fi
          bash ./gradlew assembleDebug --build-cache

      - name: Rename APK
        id: apk
        run: |
          source=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$source" ]; then
            echo "::error::No APK found at $source."
            exit 1
          fi
          name="roamigo-${GITHUB_SHA::7}.apk"
          mv "$source" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

  # A separate job keeps the write token away from the Gradle build.
  publish:
    name: Publish latest pre-release
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Publishing is never cancelled halfway, which could leave the release without an APK.
    # Queued runs wait, and only the newest one waiting is kept, so the latest commit wins.
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      APK_NAME: ${{ needs.apk.outputs.apk-name }}
      TAG: latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apk.outputs.apk-name }}

      # The tag is moved through the API because gh release cannot retarget an existing tag.
      - name: Point the latest tag at this commit
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true --silent
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          fi

      # The new APK is uploaded before the old ones are deleted, so the release always has one.
      - name: Create or update the release
        run: |
          notes="Debug APK built from the latest commit on main.

          - Commit: $GITHUB_SHA
          - Commit link: $GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA
          - Run number: $GITHUB_RUN_NUMBER ($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "Latest main build" --notes "$notes"
            gh release upload "$TAG" "$APK_NAME" --clobber
            gh release view "$TAG" --json assets --jq '.assets[].name' |
              while read -r asset; do
                if [ "$asset" != "$APK_NAME" ]; then
                  gh release delete-asset "$TAG" "$asset" --yes
                fi
              done
          else
            gh release create "$TAG" "$APK_NAME" --verify-tag --prerelease \
              --title "Latest main build" --notes "$notes"
          fi
