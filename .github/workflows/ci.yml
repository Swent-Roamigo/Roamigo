# AI assistance was used for implementation support.
name: CI - Test Runner

# Run the workflow when commits are pushed on main or when a PR is modified
on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}

jobs:
  # Fast checks that need neither Node, Firebase, KVM, nor an Android emulator.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Android build
        uses: ./.github/actions/setup-android-build
        with:
          google-services: ${{ secrets.GOOGLE_SERVICES }}

      - name: Run formatting, debug, and JVM checks
        run: ./gradlew ktfmtCheck assembleDebug lintDebug check --build-cache

      # The report job reads these, but it does not recompile or rerun the unit tests.
      - name: Collect unit test coverage inputs
        if: always()
        run: |
          tar czf checks-outputs.tgz --ignore-failed-read \
            app/build/outputs/unit_test_code_coverage \
            app/build/test-results/testDebugUnitTest \
            app/build/reports/lint-results-debug.xml \
            app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes \
            app/build/tmp/kotlin-classes/debug

      - name: Upload checks outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-outputs
          if-no-files-found: warn
          path: checks-outputs.tgz

  # Runs at the same time as the checks job instead of after it. The instrumented tests are split
  # into shards, each on its own emulator, so the slowest job is shorter. The required "CI"
  # job below aggregates them, so renaming these jobs does not affect branch protection.
  connected-tests:
    name: Connected tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Validate Mapbox access token
        run: |
          if [ -z "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "::error::Set the MAPBOX_ACCESS_TOKEN repository secret to a Mapbox public access token."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Android build
        uses: ./.github/actions/setup-android-build
        with:
          google-services: ${{ secrets.GOOGLE_SERVICES }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The CLI and the emulator jars it downloads are cached, because every shard would otherwise
      # fetch them again on each run.
      - name: Firebase CLI cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-firebase-tools-15.33.0

      - name: Firebase emulators cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.33.0

      - name: Install Firebase CLI
        run: npm install --global --prefer-offline --no-audit --no-fund firebase-tools@15.33.0

      - name: Validate Firebase emulators config
        run: |
          if [ ! -f "firebase.json" ]; then
            echo "::error::firebase.json is missing. Please run firebase init emulators."
            exit 1
          fi
          if ! jq -e '.emulators.auth.port == 9099' firebase.json >/dev/null; then
            echo "::error::firebase.json must configure the Authentication Emulator on port 9099."
            exit 1
          fi

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cache the Emulator, if the cache does not hit, create the emulator.
      # API 34 matches targetSdk. compileSdk 37 is only the compile platform.
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run connected tests
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash -o pipefail -c "firebase emulators:exec --only auth,database,firestore --project demo-roamigo --non-interactive '${{ matrix.shard == 0 && 'node --test tests/firestore/vote-closing.test.mjs && ' || '' }}./gradlew connectedCheck --build-cache -Pandroid.testInstrumentationRunnerArguments.numShards=${{ strategy.job-total }} -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard }}' 2>&1 | tee firebase-emulator.log"

      - name: Upload connected test results and Firebase logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-results-and-firebase-logs-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            firebase-emulator.log
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**

      # Both shards run the same emulator, so the coverage folders have the same name. The report
      # job reads "connected/*/coverage.ec", so each shard's folder is renamed to stay distinct.
      - name: Collect connected test coverage
        run: |
          for device in app/build/outputs/code_coverage/debugAndroidTest/connected/*/; do
            mv "${device%/}" "${device%/}-shard${{ matrix.shard }}"
          done
          tar czf connected-coverage-${{ matrix.shard }}.tgz app/build/outputs/code_coverage

      - name: Upload connected test coverage
        uses: actions/upload-artifact@v4
        with:
          name: connected-coverage-${{ matrix.shard }}
          if-no-files-found: error
          path: connected-coverage-${{ matrix.shard }}.tgz

  # Merges both coverage sources and sends them to SonarCloud once both jobs have passed.
  report:
    name: Coverage report
    needs: [checks, connected-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis

      - name: Set up Android build
        uses: ./.github/actions/setup-android-build
        with:
          google-services: ${{ secrets.GOOGLE_SERVICES }}

      - name: Download checks outputs
        uses: actions/download-artifact@v4
        with:
          name: checks-outputs

      - name: Download connected test coverage
        uses: actions/download-artifact@v4
        with:
          pattern: connected-coverage-*
          merge-multiple: true

      - name: Restore build outputs
        run: |
          tar xzf checks-outputs.tgz
          for archive in connected-coverage-*.tgz; do tar xzf "$archive"; done

      # One Gradle call instead of two: it starts the daemon and configures the project once.
      - name: Generate coverage report and upload it to SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew jacocoTestReport sonar --build-cache

  # Branch protection requires a status check named "CI", which was the single job before the
  # split. This job keeps that name and passes only if every job above succeeded. It must run
  # even when a needed job fails or is skipped: a skipped required check would count as passing.
  ci:
    name: CI
    needs: [checks, connected-tests, report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          CHECKS: ${{ needs.checks.result }}
          CONNECTED: ${{ needs.connected-tests.result }}
          REPORT: ${{ needs.report.result }}
        run: |
          echo "checks=$CHECKS connected-tests=$CONNECTED report=$REPORT"
          [ "$CHECKS" = success ] && [ "$CONNECTED" = success ] && [ "$REPORT" = success ]
