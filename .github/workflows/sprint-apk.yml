# AI assistance was used for implementation support.
name: Build Sprint APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      milestone:
        description: Sprint or milestone label (for example M1)
        required: true
        default: M1
        type: string

permissions:
  contents: read

# Push runs share one group so a newer merge cancels the outdated build;
# manual runs get their own group so a merge never cancels a milestone build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact: ${{ steps.apk.outputs.artifact }}
    env:
      # Push runs have no workflow_dispatch inputs, so fall back to a fixed label.
      MILESTONE: ${{ inputs.milestone || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate milestone label
        run: |
          if [[ ! "$MILESTONE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Use only letters, digits, dots, underscores, and hyphens for the milestone."
            exit 1
          fi

      - name: Restore Firebase and signing configuration
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$GOOGLE_SERVICES" ] || [ -z "$ANDROID_DEBUG_KEYSTORE" ]; then
            echo "::error::Set GOOGLE_SERVICES to the Base64-encoded google-services.json and ANDROID_DEBUG_KEYSTORE to the Base64-encoded team debug keystore registered in Firebase."
            exit 1
          fi
          umask 077
          printf '%s' "$GOOGLE_SERVICES" | base64 --decode > app/google-services.json
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK and run checks
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          GEONAMES_USERNAME: cdunoyer
        run: |
          if [ -z "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "::error::Set MAPBOX_ACCESS_TOKEN to the Mapbox public access token used by the app maps."
            exit 1
          fi
          bash ./gradlew ktfmtCheck assembleDebug lintDebug check --build-cache

      - name: Name APK
        id: apk
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No APK found at $apk."
            exit 1
          fi
          # Push builds are identified by commit; manual builds keep the milestone naming.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            name="roamigo-${GITHUB_SHA::7}.apk"
            mkdir -p "$RUNNER_TEMP/apk"
            path="$RUNNER_TEMP/apk/$name"
            cp "$apk" "$path"
          else
            name="Roamigo-$MILESTONE-$GITHUB_RUN_NUMBER"
            path="$apk"
          fi
          echo "artifact=$name" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Summarize artifact
        run: |
          {
            echo "## Roamigo $MILESTONE APK"
            echo "Download the APK from this run's Artifacts section and extract the ZIP before installing."
            echo "Minimum Android version: Android 9 (API 28)."
            echo "Link this successful run from the milestone wiki page:"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishing runs in its own job so only this job gets write access,
  # never the job that builds third-party code with Gradle.
  publish-latest:
    name: Publish APK to the latest pre-release
    if: github.event_name == 'push'
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      APK_NAME: ${{ needs.apk.outputs.artifact }}
      TAG: latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apk.outputs.artifact }}
          path: apk

      - name: Move the latest tag to this commit
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi

      - name: Create or update the pre-release
        run: |
          apk="apk/$APK_NAME"
          if [ ! -f "$apk" ]; then
            echo "::error::No APK found at $apk."
            exit 1
          fi
          {
            echo "Latest debug APK built from \`main\`."
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Commit link: $GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA"
            echo "- Workflow run: #$GITHUB_RUN_NUMBER ($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo "Minimum Android version: Android 9 (API 28)."
          } > notes.md
          title="Latest main build"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "$title" --notes-file notes.md
            # Upload the new APK before removing older ones so the release always has one.
            gh release upload "$TAG" "$apk" --clobber
            gh release view "$TAG" --json assets --jq '.assets[].name' |
              while read -r asset; do
                if [ "$asset" != "$APK_NAME" ]; then
                  gh release delete-asset "$TAG" "$asset" --yes
                fi
              done
          else
            gh release create "$TAG" "$apk" --prerelease --verify-tag \
              --title "$title" --notes-file notes.md
          fi
